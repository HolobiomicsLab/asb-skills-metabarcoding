name: RDP classifier
slug: rdp-classifier
version_used: '2.12'
edam_topics: []
evidence_spans:
- we used a common classification approach (the Ribosome Database Project (RDP) classifier) to calculate the frequency
- used with the RDP classifier v 2.12 for leave-one-out testing, cross-validation testing, and classifier training
- The Ribosomal Database Project (RDP) classifier uses a naïve Bayesian approach to make taxonomic assignments
- a number of software packages including RDP Classifier (Wang et al., 2007), USEARCH (Edgar, 2010), VSEARCH (Rognes et al., 2016) and NINJA-OPS
- We ran RDP classifier version 2.2 using the greengenes training input files provided by QIIME

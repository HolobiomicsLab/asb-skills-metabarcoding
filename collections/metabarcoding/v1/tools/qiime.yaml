evidence_spans:
- The initial clustering can be done in **UCLUST, VSEARCH, SWARM, QIIME, DADA2**, etc.
- which are often bundled in broader pipelines such as MOTHUR (Schloss et al., 2009) and QIIME (Caporaso et al., 2010)
- Sequence data were demultiplexed and minimally quality filtered using the QIIME 1.9.1 script split_libraries_fastq.py
- Several pipelines have been developed to perform the entire 16S analysis from end to end, including QIIME4 and MOTHUR.5
- we use a subset of the QIIME-based analyses from the Human Microbiome Project14 (HMP), which computed OTUs using PSD based upon a 97% sequence similarity threshold
- QIIME allows analysis of high-throughput community sequencing data
- Several pipelines have been developed to perform the entire 16S analysis from end to end, including QIIME4 and MOTHUR

evidence_spans:
- Cutadapt [31] is used additionally for the case of ITS to address the variability in length of this marker gene
- trimmed with Cutadapt (Martin, 2011), retaining all paired‐end reads (not merged) with a minimum length of 175 bp
- We used the QIIME 2 v2018.11 (Bolyen et al., 2019) environment to import raw reads and trimmed with Cutadapt (Martin, 2011)
- the non-redundant Greengenes v13.8.99 full-length 16S database via Cutadapt
- We used CUTADAPT v1.10 to retrieve primer-trimmed sequences using default settings (allowing up to a 10% mismatch in the primer sequence)
- We used CUTADAPT v1.10 to retrieve primer-trimmed sequences using default settings
- trimmed from adaptors and primers (with cutadapt for example), and converted to fasta.
- primer removal and removal of poly-G-tails - using cutadapt
- Prior to quality filtering, dadasnake optionally removes primers and re-orients reads using cutadapt [25]
- 'to_trim: true                    # enable primer trimming with Cutadapt'
- Primers were removed with cutadapt (Martin, EMBnet)
- Cutadapt removes adapter sequences from high-throughput sequencing reads

- We performed eDNA metabarcoding of flowers from several different plant species using two sets of generic primers, targeting the mitochondrial genes 16S rRNA and COI.
- We obtained eDNA from at least 135 arthropod species in 67 families and 14 orders, together representing diverse ecological groups
- All statistical analyses were performed in R (R Core Team, 2018) version 3.5.1
- these data were generated using the [figure4_database_comparisons.R](https://github.com/devonorourke/tidybug/blob/master/scripts/R_scripts/figure4_database_comparisons.R) R script.
- The alpha diversity indices and rarefaction curves were estimated in R (version 3.4.1) with compatible phyloseq and vegan packages.
- IPython notebooks and scripts (Python, Java, R, Bash) developed for meta-analysis of EMP data
- github.com__marinebon__eDNA_microbes_whales
- Community network analysis provided evidence of expected predator-prey relationships, trophic linkages, and seasonal shifts across all domains of life.
